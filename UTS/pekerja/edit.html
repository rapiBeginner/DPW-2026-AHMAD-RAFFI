<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belle Salon | Edit Employee</title>
    <link rel="stylesheet" href="../asset/style.css">
</head>

<body>
    <header>
        <button type="button" id="nav-toggle-btn" class="nav-toggle-label" aria-label="Menu">
            &#9776;
        </button>
        <h1>Belle Salon</h1>
        <nav>
            <ul>
                <li><a href="../index.html">Home</a></li>
                <li><a href="../pekerja/list.html">Employee List</a></li>
                <li><a href="../pekerja/tambah.html">Add Employee</a></li>
                <li><a href="../customer/list.html">Customer List</a></li>
                <li><a href="../customer/tambah.html">Add Customer</a></li>
                <li><a href="../booking/list.html">Booking List</a></li>
                <li><a href="../booking/tambah.html">Add Booking</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Edit Employee</h2>
            <p>Update the employee information below.</p>

            <form id="form-edit">
                <p>
                    <label for="nama">Full Name</label>
                    <input type="text" id="nama" name="nama" required>
                </p>

                <p>
                    <label for="jenis_kelamin">Gender</label>
                    <select id="jenis_kelamin" name="jenis_kelamin" required>
                        <option value="">Select gender</option>
                        <option value="Perempuan">Female</option>
                        <option value="Laki-laki">Male</option>
                    </select>
                </p>

                <p>
                    <label for="no_hp">Phone Number</label>
                    <input type="tel" id="no_hp" name="no_hp" placeholder="08xxxxxxxxxx" required>
                </p>

                <p>
                    <label for="jabatan">Position</label>
                    <select id="jabatan" name="jabatan" required>
                        <option value="">Select position</option>
                        <option value="Hair Stylist">Hair Stylist</option>
                        <option value="Beautician">Beautician</option>
                        <option value="Nail Artist">Nail Artist</option>
                        <option value="Terapis">Therapist</option>
                        <option value="Kasir">Cashier</option>
                        <option value="Resepsionis">Receptionist</option>
                    </select>
                </p>

                <p>
                    <label for="keahlian">Expertise</label>
                    <input type="text" id="keahlian" name="keahlian" placeholder="Example: Hair Coloring, Hair Cut"
                        required>
                </p>

                <p>
                    <label for="status">Employment Status</label>
                    <select id="status" name="status" required>
                        <option value="Aktif">Active</option>
                        <option value="Tidak Aktif">Inactive</option>
                    </select>
                </p>

                <p>
                    <button type="submit">Update Employee</button>
                </p>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Belle Salon &mdash; Salon Management System</p>
    </footer>

    <script src="../asset/app.js"></script>
    <script src="../asset/pekerja.js"></script>
</body>

</html>
